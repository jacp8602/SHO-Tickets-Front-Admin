<!-- Contenido con padding -->
<!-- <div class="px-6 py-4"> -->
    <!-- Loading indicator -->
    @if (isLoading) {
        <div class="flex justify-center py-8">
            <mat-progress-spinner [diameter]="40" [mode]="'indeterminate'"></mat-progress-spinner>
        </div>
    } @else {
        <!-- Tabla de eventos -->
        <div class="bg-white overflow-hidden shadow-sm">
            <div class="overflow-x-auto max-h-[60vh] overflow-y-auto">
                <table class="w-full">
                    <thead class="bg-white border-b border-gray-200 sticky top-0">
                        <tr>
                            <th class="text-left text-xs font-bold text-gray-600 tracking-wider px-4 py-3">City</th>
                            <th class="text-left text-xs font-bold text-gray-600 tracking-wider px-4 py-3">Address</th>
                            <th class="text-left text-xs font-bold text-gray-600 tracking-wider px-4 py-3">Date</th>
                            <th class="text-left text-xs font-bold text-gray-600 tracking-wider px-4 py-3">Place Name</th>
                            <th class="text-left text-xs font-bold text-gray-600 tracking-wider px-4 py-3">Show</th>
                            <th class="text-right text-xs font-bold text-gray-600 tracking-wider px-4 py-3">Seats</th>
                            <th class="text-left text-xs font-bold text-gray-600 tracking-wider px-4 py-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        @for (event of events; track trackById($index, event)) {
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-4 py-3 text-sm text-gray-900">{{ event.city }}</td>
                                <td class="px-4 py-3 text-sm text-gray-600" [innerHTML]="event.address"></td>
                                <td class="px-4 py-3 text-sm text-gray-600">{{ event.date }}</td>
                                <td class="px-4 py-3 text-sm text-gray-600" [innerHTML]="event.placeName"></td>
                                <td class="px-4 py-3 text-sm text-gray-600">{{ event.show }}</td>
                                <td class="px-4 py-3 text-sm text-gray-600 text-right">{{ event.seats | number }}</td>
                                <td class="px-4 py-3">                                        
                                    <!-- Edit -->
                                    <button mat-icon-button class="w-7 h-7 text-blue-500 hover:text-blue-700 hover:bg-blue-50 rounded-full"
                                        (click)="onEditEvent(event)" matTooltip="Edit event" type="button">
                                        <mat-icon class="text-base">edit</mat-icon>
                                    </button>
                                    <button mat-icon-button class="w-7 h-7 text-blue-500 hover:text-blue-700 hover:bg-blue-50 rounded-full"
                                        (click)="onEditEvent(event)" matTooltip="Delete event" type="button">
                                        <mat-icon class="text-base">delete</mat-icon>
                                    </button>
                                </td>
                            </tr>
                        } @empty {
                            <tr>
                                <td colspan="7" class="px-4 py-8 text-center text-gray-500">
                                    No events found
                                </td>
                            </tr>
                        }
                    </tbody>
                </table>
            </div>
        </div>
    }
<!-- </div> -->
