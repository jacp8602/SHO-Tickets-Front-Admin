<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sitio en Construcción — ¡Volvemos pronto!</title>
  <meta name="description" content="Estamos construyendo algo increíble. Vuelve pronto o suscríbete para recibir novedades." />
  <style>
    :root{
      --bg1:#0f172a; /* navy */
      --bg2:#05263b; /* deep teal */
      --accent:#ffb86b; /* warm amber */
      --muted:#9aa4b2;
      --glass: rgba(255,255,255,0.06);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    /* Reset */
    *{box-sizing:border-box;margin:0;padding:0}
    html,body,#app{height:100%}
    body{
      min-height:100vh;
      background:radial-gradient(1000px 600px at 10% 10%, rgba(255,184,107,0.06), transparent 6%),
                linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 100%);
      color:#e6eef6;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;align-items:center;justify-content:center;padding:2rem;
    }

    .card{
      width:100%;max-width:1100px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:18px;padding:2rem;display:grid;grid-template-columns:1fr 420px;gap:2rem;box-shadow:0 10px 40px rgba(2,6,23,0.7);
      border:1px solid rgba(255,255,255,0.03);
      backdrop-filter: blur(6px);
    }

    .left{
      display:flex;flex-direction:column;gap:1.25rem;justify-content:center;
    }
    h1{font-size:clamp(1.6rem, 3.8vw, 2.6rem);line-height:1.02}
    p.lead{color:var(--muted);font-size:1rem}

    .features{display:flex;gap:1rem;margin-top:0.5rem;flex-wrap:wrap}
    .pill{background:var(--glass);padding:0.5rem 0.75rem;border-radius:999px;font-size:0.9rem;color:var(--muted);display:inline-flex;align-items:center;gap:0.6rem}

    /* Animated construction scene */
    .scene{display:flex;align-items:center;justify-content:center;height:260px}
    .tower{width:220px;height:180px;position:relative}
    .block{position:absolute;background:linear-gradient(180deg,#18304a,#0b2130);border-radius:4px;box-shadow:inset 0 -6px 12px rgba(0,0,0,0.3)}
    .block.b1{left:20px;bottom:0;width:180px;height:40px}
    .block.b2{left:40px;bottom:40px;width:140px;height:36px}
    .block.b3{left:60px;bottom:76px;width:80px;height:32px}
    .crane{position:absolute;right:-12px;bottom:10px;width:120px;height:160px}
    .crane .arm{position:absolute;left:12px;top:0;width:8px;height:120px;background:#ffb86b;border-radius:4px;transform-origin:top center;animation:crane 4s ease-in-out infinite}
    .crane .boom{position:absolute;left:-60px;top:20px;width:160px;height:8px;background:#ffb86b;border-radius:6px}
    .hook{position:absolute;left:26px;top:118px;width:8px;height:36px;background:#ffd9b3;border-radius:3px;animation:hook 1.6s linear infinite}

    @keyframes crane{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
    @keyframes hook{0%{transform:translateY(0)}50%{transform:translateY(8px)}100%{transform:translateY(0)}}

    /* Right column */
    .right{padding:1rem;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));display:flex;flex-direction:column;gap:1rem;align-items:stretch}
    .count{font-size:1.8rem;font-weight:700}
    .meta{color:var(--muted);font-size:0.9rem}

    .progress-wrap{background:rgba(255,255,255,0.03);padding:0.5rem;border-radius:12px}
    .bar{height:10px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden}
    .bar > i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#ffd9b3);transition:width 0.9s cubic-bezier(.2,.9,.3,1);}

    form.subscribe{display:flex;gap:0.5rem}
    input[type=email]{flex:1;padding:0.6rem 0.75rem;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit}
    button.cta{padding:0.6rem 0.9rem;border-radius:10px;border:0;background:linear-gradient(180deg,var(--accent),#ff9f43);color:#081225;font-weight:700;cursor:pointer}

    .socials{display:flex;gap:0.5rem;align-items:center}
    .icon{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,0.03);display:inline-flex;align-items:center;justify-content:center}

    footer.small{grid-column:1/-1;color:var(--muted);font-size:0.85rem;margin-top:0.5rem;display:flex;justify-content:space-between;align-items:center}

    /* Responsive */
    @media (max-width:900px){
      .card{grid-template-columns:1fr;max-width:740px}
      .scene{height:200px}
    }
    @media (max-width:420px){
      .card{padding:1rem}
      .right{order:2}
      .left{order:1}
    }
  </style>
</head>
<body>
  <div id="app" class="card" role="main">
    <section class="left">
      <div>
        <h1>Estamos construyendo algo <span style="color:var(--accent)">increíble</span></h1>
        <p class="lead">SHO-TIKETS-FRONT-ADMIN</p>
        <div class="features" aria-hidden="true">
          <span class="pill">🚀 Lanzamiento rápido</span>
          <span class="pill">🔒 Seguridad desde el inicio</span>
          <span class="pill">⚙️ Optimizado</span>
        </div>
      </div>

      <div class="scene" aria-hidden="true">
        <div class="tower" aria-hidden="true">
          <div class="block b1"></div>
          <div class="block b2"></div>
          <div class="block b3"></div>
          <div class="crane">
            <div class="arm"></div>
            <div class="boom"></div>
            <div class="hook"></div>
          </div>
        </div>
      </div>
    </section>

    <aside class="right" aria-label="Panel de información">
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div class="meta">Lanzamiento estimado</div>
            <div class="count" id="countdown">Calculando...</div>
            <div class="meta" id="targetDate"></div>
          </div>
          <div style="text-align:right">
            <div class="meta">Progreso</div>
            <div class="progress-wrap" style="width:160px;margin-top:0.5rem">
              <div class="bar" aria-hidden="true"><i id="progressBar"></i></div>
            </div>
            <div class="meta" id="progPercent" style="margin-top:0.4rem">0%</div>
          </div>
        </div>
      </div>

      <div>
        <form class="subscribe" id="subscribeForm" onsubmit="return false;">
          <input id="email" type="email" placeholder="tu@correo.com" aria-label="Correo electrónico" required />
          <button class="cta" id="btnSubmit">Suscribirme</button>
        </form>
        <div id="msg" class="meta" style="margin-top:0.6rem"></div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:auto">
        <div class="socials" aria-label="Redes sociales">
          <a href="#" class="icon" title="Twitter" aria-label="Twitter"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 6.5c-.6.3-1.2.5-1.9.6.7-.4 1.2-1.1 1.5-1.8-.7.4-1.5.7-2.3.9C16.5 5 15.6 4.5 14.5 4.5c-1.8 0-3.2 1.5-3.2 3.3 0 .3 0 .6.1.9C8.4 8.6 6 7.2 4.4 5.1c-.4.7-.6 1.5-.6 2.3 0 1.2.6 2.3 1.6 2.9-.5 0-1-.1-1.4-.4v.1c0 1.8 1.3 3.3 3 3.7-.4.1-.8.1-1.3.1-.3 0-.6 0-.9-.1C7.7 17.6 9.4 18 11.2 18c4.7 0 7.3-4 7.3-7.4v-.3c.5-.4.9-.9 1.2-1.5-.4.2-.8.3-1.2.4z" fill="currentColor"/></svg></a>
          <a href="#" class="icon" title="GitHub" aria-label="GitHub"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M12 .5C5.7.5.8 5.4.8 11.7c0 4.8 3.1 8.9 7.3 10.3.5.1.7-.2.7-.5v-1.8c-3 0-3.7-1.3-3.9-2.6-.1-.4-.6-1.6-1-1.9-.3-.2-.8-.7 0-.7.7 0 1.2.6 1.4.8.8 1.4 2.1 1 2.6.8.1-.6.4-1 .7-1.2-2.7-.3-5.6-1.4-5.6-6.2 0-1.4.5-2.5 1.3-3.4-.1-.3-.6-1.6.1-3.3 0 0 1-.3 3.4 1.2 1-.3 2-.4 3-.4s2 .1 3 .4c2.4-1.5 3.4-1.2 3.4-1.2.7 1.7.2 3 .1 3.3.8.9 1.3 2 1.3 3.4 0 4.8-2.9 5.9-5.6 6.2.4.4.7 1 .7 2v3c0 .3.2.6.8.5 4.2-1.4 7.3-5.5 7.3-10.3C23.2 5.4 18.3.5 12 .5z"/></svg></a>
        </div>
        
      </div>
    </aside>

    <footer class="small"> <div>© <span id="year"></span>ProdevSolutions</div> <div>Diseño por el equipo — <span style="color:var(--accent)">En Construcción</span></div></footer>
  </div>

  <script>
    // Small script to power countdown, progress and simple subscribe mock
    (function(){
      const daysToLaunch = 30; // default launch in ~30 days from first load
      const now = new Date();
      const target = new Date(now.getTime() + daysToLaunch*24*60*60*1000);
      const targetDateEl = document.getElementById('targetDate');
      const countdownEl = document.getElementById('countdown');
      const progEl = document.getElementById('progressBar');
      const progPctEl = document.getElementById('progPercent');

      function updateCountdown(){
        const diff = target - new Date();
        if(diff<=0){ countdownEl.textContent = 'Hoy'; targetDateEl.textContent = '';
        } else {
          const d = Math.floor(diff/86400000);
          const h = Math.floor((diff%86400000)/3600000);
          const m = Math.floor((diff%3600000)/60000);
          countdownEl.textContent = `${d}d ${h}h ${m}m`;
          targetDateEl.textContent = target.toLocaleDateString();
        }
      }

      function setProgress(pct){
        const val = Math.max(0, Math.min(100, pct));
        progEl.style.width = val + '%';
        progPctEl.textContent = val + '%';
      }

      // read saved progress from localStorage or seed with 14
      const stored = parseInt(localStorage.getItem('site_progress') || '14',10);
      setProgress(stored);

      // animate small increases to feel alive
      let animPct = stored;
      setInterval(()=>{
        animPct = Math.min(95, animPct + Math.floor(Math.random()*3));
        setProgress(animPct);
      }, 4000);

      // countdown tick every 30s
      updateCountdown();
      setInterval(updateCountdown, 30000);

      document.getElementById('year').textContent = new Date().getFullYear();

      // subscribe mock
      const form = document.getElementById('subscribeForm');
      const msg = document.getElementById('msg');
      form.addEventListener('submit', (e)=>{
        const email = document.getElementById('email').value.trim();
        if(!email || !email.includes('@')){ msg.textContent = 'Introduce un correo válido.'; return; }
        msg.textContent = 'Gracias — te avisaremos cuando lancemos.';
        // simulate saving
        setTimeout(()=>{
          localStorage.setItem('subscribed_'+email, new Date().toISOString());
        },500);
      });

      // expose an easy API for authors
      window.underConstruction = {
        setTargetDate: (d) => { if(d instanceof Date){ target.setTime(d.getTime()); updateCountdown(); } },
        setProgress: (p) => { localStorage.setItem('site_progress', String(Math.max(0,Math.min(100,p)))); setProgress(p); }
      };
    })();
  </script>
</body>
</html>
